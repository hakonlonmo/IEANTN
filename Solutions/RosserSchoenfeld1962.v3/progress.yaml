strategy:
  finite: Checked prime witnesses on a rational interval covering 41/2 <= x < 4096.
  tail: >-
    Weighted factorials give psi(y) >= 0.92*y - 5*log(y) - 1.
    Combine with the existing proved psi(x) < 1.03883*x and Mathlib's proved Costa-Pereira
    psi-theta inequality at y=2*x, bounding each of the three psi terms by
    1.03883*sqrt(y). Bound the log-weighted prime
    interval sum above by (pi(2*x)-pi(x))*log(2*x).
dependencies:
  - IEANTN Vocabulary definition of primeCounting; no conclusion assumed.
  - >-
    Unchanged sibling v1 RS12 solution library: locally Lean-checked, zero sorryAx,
    awaiting Comparator. Its actual proof is included, not a hypothesis or axiom.
  - >-
    LeanCert 6b11513512c9d27183fb4725bfc291ab38b4a6d7, same as v1.
    Exact rational logarithm endpoints are kernel-checked.
  - >-
    Selected elementary Chebyshev proofs adapted from read-only PNT+ at
    81eca5aa3fa4779883a9aeba18e49087c5366e0f; imported analytic closure is pruned.
alternatives:
  historical: >-
    Theorem 2 (3.3) and (3.4) suffice for the tail; the paper directs finite
    exceptions to Lehmer's table without spelling out the cutoff. For instance,
    log(x)>=6 and log(2)<0.7 imply the required rational inequality.
    Theorem 2's proof on p.82 uses Theorems 16 and 31 and is substantial.
  modern: >-
    Buthe's bounds are literature/numerical evidence. DudekPlattNumerics.v4 is
    Comparator-verified conditional on MT.v2.corollary_1, itself literature evidence.
    PrimeInterval.v1 is Comparator-verified but supplies conditional transfer machinery,
    not the needed unconditional error estimates. None provides a grounded short bridge.
trust:
  opaque_numerics: none
  comparator: Pending; no receipt is created or justification designated by the author.

cutoff_audit:
  choice: 4096 = 64^2 is a convenient sufficient cutoff, not an optimal one.
  forcing_step: >-
    For s=sqrt(x)>=64, Costa-Pereira plus the v1 upper bound gives
    psi(2*x)-theta(2*x) < 3*1.03883*sqrt(2*x)
    <= 3*1.03883*(3/2)*s < (19/4)*s <= (19/256)*x.
    The last conversion uses s>=64 and determines the chosen cutoff.
  logarithmic_error: >-
    log(2*x)<=5*s/32, from log(t)<=t-1 applied at t=s/64 and log(2)<0.6931471808.
    Then 5*log(2*x)+1 < x/50; at s=64 its sufficient comparison is 51<81.92.
  theta_margin: >-
    1.84-1.03883-19/256-1/50 = 0.70695125.
    This exceeds 0.7 by 5561/800000, a margin of 28.47232 at x=4096.
  target_margin: >-
    At x=4096=2^12, (3*x/(5*log(x)))*log(2*x)=(13/20)*x=0.65*x,
    leaving 0.05*x=204.8 below the 0.7*x comparison line.
  refinement: >-
    The initial 65536 tail compiled. The sharper 4096 tail then compiled before
    regenerating any finite certificate. Only [41/2,4096) is retained in the final data.
finite_certificates:
  intervals: 48
  supplied_primes: 3356
  maximum_list_length: 323
  kernel_batch_size: 64
  arithmetic: >-
    Boolean trial division through Nat.sqrt(p), with a soundness theorem derived from
    Nat.prime_def_le_sqrt; adjacent strict ordering certifies distinctness. Integer
    endpoint checks place each witness in (x,2*x] on the half-open rational interval.
    Exact integer inequalities compare the witness count with a certified lower bound
    for log(x). No completeness of the witness lists is assumed or needed.
  generator: scripts/generate_finite.py; --check verifies reproducibility, not mathematical truth.
  truth_check: All 48 data modules and Interval.Finite have built successfully in Lean.

